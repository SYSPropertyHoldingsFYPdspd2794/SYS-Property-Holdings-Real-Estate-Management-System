name: 🚀 Deploy to InfinityFree

on:
  push:
    branches:
      - main  # This will be triggered whenever someone pushes code to the main branch.

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 📂 Sync files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: /htdocs/  # [Key] InfinityFree requires that web page files must be placed in the htdocs folder.
        exclude: |
          **/.git*
          **/.git*/**
          **/.github*/**